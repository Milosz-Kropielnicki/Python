{% extends "base.html" %}

{% block mainbody %}

{% include "board.html" %}

<div
    hx-post="/tick"
    hx-trigger="every 300ms"
    hx-swap="none">
</div>

<div id="over"></div>

<div

    hx-trigger="every 1s"

{% endblock %}
